<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60" width="200" height="60">
  <!-- Navy background for H N letters -->
  <rect x="5" y="5" width="50" height="50" rx="8" fill="#1B2A57"/>
  <!-- H letter -->
  <text x="15" y="42" font-family="'Be Vietnam Pro', Arial, sans-serif" font-weight="800" font-size="32" fill="#FFFFFF">H</text>
  <!-- N letter -->
  <text x="33" y="42" font-family="'Be Vietnam Pro', Arial, sans-serif" font-weight="800" font-size="32" fill="#E06928">N</text>
  <!-- Road swoosh -->
  <path d="M 12 48 Q 30 42, 48 48" stroke="#D9A21B" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- Company name -->
  <text x="65" y="28" font-family="'Be Vietnam Pro', Arial, sans-serif" font-weight="800" font-size="18" fill="#1B2A57" letter-spacing="-0.5">HẬU NGUYỄN</text>
  <!-- Tagline -->
  <text x="65" y="46" font-family="'Be Vietnam Pro', Arial, sans-serif" font-weight="500" font-size="8" fill="#5B6482" letter-spacing="1.5">VẬN TẢI · XÂY DỰNG · DỊCH VỤ</text>
</svg>
